<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>NBA Live</title>
<script>
  // Set the theme before the page paints, so it does not flash
  (function () {
    var t = null;
    try { t = localStorage.getItem("nba-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="light"] {
    --bg: #FFFFFF; --ink: #16181D; --mute: #5B6170; --faint: #9AA1AE;
    --rule: #E4E7EC; --rule-soft: #EEF0F3; --rule-strong: #16181D; --rule-bench: #9AA1AE;
    --sel: #F1F4FA; --accent: #1D5BD8; --live: #C4320A;
    --heat: 255, 196, 0; --heat-max: .42; --qwin: #FFF1C2;
    --plus: #1B7A3D; --minus: #B3261E;
    --err-bg: #FDECEA; --err-ink: #8A1C12; --err-rule: #F3B9B2;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #14171C; --ink: #E7EAF0; --mute: #A3AAB8; --faint: #6B7280;
    --rule: #2A2F38; --rule-soft: #22262E; --rule-strong: #E7EAF0; --rule-bench: #59606E;
    --sel: #1F2633; --accent: #7AA7FF; --live: #FF8A5C;
    --heat: 255, 196, 0; --heat-max: .30; --qwin: rgba(255, 196, 0, .20);
    --plus: #5BD08A; --minus: #FF8A80;
    --err-bg: #3A1F1D; --err-ink: #FFC4BD; --err-rule: #6E2E28;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums;
    transition: background-color .2s, color .2s; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  img { display: block; }
  .icon-btn { color: var(--mute); padding: 6px; display: inline-flex; border-radius: 6px; }
  .icon-btn:hover { color: var(--ink); background: var(--sel); }

  /* ---------- Header ---------- */
  header { border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 5; background: var(--bg); }
  .head { max-width: 1280px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .datebox { display: flex; align-items: center; gap: 2px; border: 1px solid var(--rule); border-radius: 6px; }
  .datebox label { position: relative; font-weight: 600; padding: 0 6px; cursor: pointer; }
  .datebox input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .today { color: var(--accent); font-weight: 600; padding: 4px 2px; }
  .today[hidden] { display: none; }
  .status { margin-left: auto; font-size: 12.5px; color: var(--mute); display: flex; align-items: center; gap: 4px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 4px; display: none; }
  .status.live .dot { display: inline-block; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .theme-icon-dark { display: none; }
  [data-theme="dark"] .theme-icon-dark { display: block; }
  [data-theme="dark"] .theme-icon-light { display: none; }

  .err { max-width: 1280px; margin: 12px auto 0; padding: 0 20px; display: none; }
  .err p { margin: 0; background: var(--err-bg); color: var(--err-ink); border: 1px solid var(--err-rule); border-radius: 6px; padding: 8px 12px; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  nav.games { flex: 1 1 220px; max-width: 240px; padding-top: 16px; }
  @media (min-width: 761px) { nav.games { position: sticky; top: 58px; max-height: calc(100vh - 70px); overflow-y: auto; } }
  main { flex: 999 1 640px; min-width: 0; padding: 16px 0 48px; }

  .game { display: block; width: 100%; text-align: left; padding: 9px 12px; margin-bottom: 4px; border-radius: 6px; }
  .game:hover { background: var(--sel); }
  .game.on { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .g-row { display: flex; align-items: center; gap: 8px; color: var(--mute); }
  .g-row.win { color: var(--ink); font-weight: 700; }
  .g-row img { width: 18px; height: 18px; object-fit: contain; flex: none; }
  .g-row .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-st { font-size: 12px; color: var(--mute); margin-top: 2px; }
  .g-st.live { color: var(--live); font-weight: 600; }
  .flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { background: rgba(var(--heat), .6); } 100% { background: transparent; } }

  @media (max-width: 760px) {
    .wrap { gap: 0; }
    nav.games { max-width: none; flex-basis: 100%; display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; }
    .game { flex: none; width: 168px; margin: 0; border: 1px solid var(--rule); }
    .game.on { box-shadow: inset 0 -3px 0 var(--accent); }
    main { padding-top: 8px; }
  }

  .empty { color: var(--mute); padding: 48px 0; text-align: center; }
  .empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

  /* ---------- Game header ---------- */
  .ghead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 40px; padding-bottom: 16px; border-bottom: 2px solid var(--rule-strong); }
  .ghead .sub { font-size: 13px; color: var(--mute); }
  .ghead .sub.live { color: var(--live); font-weight: 600; }
  .ghead h2 { margin: 2px 0 0; font-size: 34px; line-height: 1.15; font-weight: 400; }
  .ghead h2 .lose { color: var(--mute); }
  .ghead h2 .win { font-weight: 700; }
  .qt { margin-left: auto; min-width: 280px; }
  .qgrid { display: grid; }
  .qgrid span { text-align: right; padding: 3px 4px 3px 0; }
  .qgrid .hd { font-size: 12px; color: var(--mute); padding-top: 0; }
  .qgrid .tm { text-align: left; display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .qgrid .row { border-top: 1px solid var(--rule); }
  .qgrid .qw { font-weight: 700; background: var(--qwin); }
  .qgrid .tot { font-weight: 700; }
  .chip { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  /* ---------- Box scores ---------- */
  .team { margin-top: 22px; }
  .team-h { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .team-h img { width: 22px; height: 22px; object-fit: contain; }
  .team-h h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .team-h .lead { font-size: 13px; color: var(--mute); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 700px; font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; }
  th, td { text-align: right; padding: 4px 6px 4px 0; white-space: nowrap; }
  th { font-size: 12px; font-weight: 400; color: var(--mute); border-bottom: 1px solid var(--rule-strong); }
  td { border-bottom: 1px solid var(--rule-soft); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--bg); z-index: 1; min-width: 124px; }
  td.pl.st { font-weight: 600; }
  td.pl .pos { color: var(--mute); font-size: 12px; margin-left: 5px; font-weight: 400; }
  tr.last-st td { border-bottom-color: var(--rule-bench); }
  td.pts { font-weight: 700; }
  td.zero { color: var(--faint); }
  td.top { font-weight: 600; }
  td.plus { color: var(--plus); }
  td.minus { color: var(--minus); }
  td.dnp { text-align: left; color: var(--mute); font-style: italic; }
  tr.tot td { font-weight: 700; border-top: 1px solid var(--rule-strong); border-bottom: 0; padding-top: 5px; }

  /* ---------- Team stats ---------- */
  .tstats { margin-top: 28px; max-width: 620px; }
  .tstats h3 { margin: 0 0 6px; font-size: 16px; font-weight: 700; }
  .tstats table { min-width: 0; font-family: inherit; }
  .tstats td, .tstats th { padding: 4px 0; }
  .tstats td:first-child, .tstats th:first-child { position: static; min-width: 0; }
  .tstats .b { font-weight: 700; }
  .edge { display: inline-flex; align-items: center; gap: 6px; color: var(--mute); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="head">
    <h1>NBA Live</h1>
    <div class="datebox">
      <button class="icon-btn" id="prev" aria-label="Previous day"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <label><span id="datetext">Today</span><input type="date" id="date" aria-label="Pick a date"></label>
      <button class="icon-btn" id="next" aria-label="Next day"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button class="today" id="today" hidden>Today</button>
    <div class="status" id="status">
      <span class="dot"></span><span id="upd">Loading scores</span>
      <button class="icon-btn" id="refresh" aria-label="Refresh now" title="Refresh now"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
      <button class="icon-btn" id="theme" aria-label="Switch to dark mode" title="Switch light or dark">
        <svg class="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="err" id="err"><p id="errtext"></p></div>
<div class="wrap">
  <nav class="games" id="games" aria-label="Games"></nav>
  <main id="detail" aria-live="polite"></main>
</div>

<script>
const API = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba";
const LIVE_MS = 20000, IDLE_MS = 120000;

let curDate = null;   // "YYYYMMDD"; null = ESPN's current day
let shownDate = null, todayKey = null;
let selId = null, timer = null, events = [];
let lastScores = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const theme = () => document.documentElement.dataset.theme;

// ---------- Theme ----------
function applyTheme(t, save) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#14171C" : "#FFFFFF";
  $("theme").setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  if (save) { try { localStorage.setItem("nba-theme", t); } catch (e) {} }
  // team colours depend on the theme: draw again
  renderGames(true);
  if (lastBox) renderBox(lastBox);
}
$("theme").onclick = () => applyTheme(theme() === "dark" ? "light" : "dark", true);
// follow the device setting, unless the person picked one
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", (e) => {
  let saved = null; try { saved = localStorage.getItem("nba-theme"); } catch (_) {}
  if (!saved) applyTheme(e.matches ? "dark" : "light", false);
});

// ---------- Dates ----------
const ymd = (dt) => `${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,"0")}${String(dt.getDate()).padStart(2,"0")}`;
const parse = (d) => new Date(+d.slice(0,4), +d.slice(4,6) - 1, +d.slice(6,8));
const shift = (d, n) => { const t = parse(d); t.setDate(t.getDate() + n); return ymd(t); };
const nice = (d) => parse(d).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
function renderDate() {
  if (!shownDate) return;
  $("datetext").textContent = shownDate === todayKey ? `Today, ${nice(shownDate).replace(/^\w+,?\s*/, "")}` : nice(shownDate);
  $("date").value = `${shownDate.slice(0,4)}-${shownDate.slice(4,6)}-${shownDate.slice(6,8)}`;
  $("today").hidden = !todayKey || shownDate === todayKey;
}
function goDate(d) {
  curDate = d === todayKey ? null : d;
  shownDate = d; selId = null; lastBox = null; renderDate();
  $("detail").innerHTML = `<div class="empty">Loading games</div>`;
  loadScores();
}

// ---------- Helpers ----------
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
function showErr(m) { $("err").style.display = m ? "block" : "none"; $("errtext").textContent = m || ""; }
function lum(hex) {
  const h = (hex || "").replace("#", "");
  if (h.length !== 6) return 0;
  const c = [0, 2, 4].map(i => { const v = parseInt(h.slice(i, i + 2), 16) / 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
// A team colour that can be seen on the current background
function tcolor(team) {
  const opts = [team?.color, team?.alternateColor].filter(Boolean).map(c => "#" + c);
  const ok = theme() === "dark" ? (c) => lum(c) > .06 : (c) => lum(c) < .7;
  return opts.find(ok) || opts[0] || "#9AA1AE";
}
const num = (v) => { const m = String(v ?? "").match(/^[+-]?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
function sides(comp) {
  const c = comp?.competitors || [];
  return { away: c.find(x => x.homeAway === "away") || c[0] || {}, home: c.find(x => x.homeAway === "home") || c[1] || {} };
}
function status(ev, comp) {
  const st = (comp?.status || ev?.status)?.type || {};
  let text = st.shortDetail || st.detail || "";
  if (st.state === "pre" && ev?.date) text = new Date(ev.date).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (st.state === "post") text = /OT/.test(text) ? text.replace(/^Final\/?/, "Final, ") : "Final";
  return { state: st.state, text };
}
function logo(team) { return team?.logos?.[0]?.href || team?.logo || ""; }

// ---------- Game list ----------
function renderGames(quiet) {
  const box = $("games");
  if (!events.length) { box.innerHTML = ""; return; }
  const order = { in: 0, pre: 1, post: 2 };
  const list = [...events].sort((a, b) => (order[a.status?.type?.state] ?? 3) - (order[b.status?.type?.state] ?? 3) || new Date(a.date) - new Date(b.date));
  box.innerHTML = list.map(ev => {
    const comp = ev.competitions?.[0];
    const { away, home } = sides(comp);
    const s = status(ev, comp);
    const show = s.state !== "pre";
    const a = +away.score || 0, h = +home.score || 0;
    const prev = lastScores[ev.id];
    const changed = (t, k) => !quiet && prev && prev[k] !== t.score;
    const row = (t, me, them, k) => `<div class="g-row ${show && me > them ? "win" : ""} ${changed(t, k) ? "flash" : ""}">
        <img src="${esc(t.team?.logo)}" alt="" width="18" height="18" loading="lazy">
        <span class="n">${esc(t.team?.shortDisplayName || t.team?.displayName)}</span><span>${show ? esc(t.score) : ""}</span></div>`;
    if (!quiet) lastScores[ev.id] = { a: away.score, h: home.score };
    return `<button class="game ${ev.id === selId ? "on" : ""}" data-id="${esc(ev.id)}" aria-pressed="${ev.id === selId}">
      ${row(away, a, h, "a")}${row(home, h, a, "h")}
      <div class="g-st ${s.state === "in" ? "live" : ""}">${esc(s.text)}</div></button>`;
  }).join("");
  box.querySelectorAll(".game").forEach(el => el.onclick = () => { selId = el.dataset.id; lastBox = null; renderGames(true); loadBox(); });
}

async function loadScores() {
  clearTimeout(timer);
  try {
    const data = await getJSON(`${API}/scoreboard` + (curDate ? `?dates=${curDate}` : ""));
    events = data.events || [];
    if (!curDate) { const d = data.day?.date; todayKey = d ? d.replaceAll("-", "") : ymd(new Date()); shownDate = todayKey; }
    renderDate(); showErr("");
    renderGames(false);
    if (!events.length) {
      $("detail").innerHTML = `<div class="empty"><strong>No games on ${esc(nice(shownDate))}</strong>Pick another day.</div>`;
    } else if (selId && events.some(e => e.id === selId)) {
      loadBox(true);
    } else {
      // open the first game in the list (live first)
      selId = $("games").querySelector(".game")?.dataset.id; renderGames(true); loadBox();
    }
    const live = events.some(e => e.status?.type?.state === "in");
    $("status").classList.toggle("live", live);
    const t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    $("upd").textContent = live ? `Live, updated ${t}` : `Updated ${t}`;
    timer = setTimeout(loadScores, live ? LIVE_MS : IDLE_MS);
  } catch (e) {
    showErr(`Scores did not load (${e.message}). Next try in 20 seconds.`);
    $("upd").textContent = "Not connected";
    timer = setTimeout(loadScores, LIVE_MS);
  }
}

// ---------- Game detail ----------
let lastBox = null;
async function loadBox(quiet) {
  const id = selId;
  if (!quiet) $("detail").innerHTML = `<div class="empty">Loading the box score</div>`;
  try {
    const data = await getJSON(`${API}/summary?event=${id}`);
    if (id !== selId) return;
    lastBox = data; renderBox(data);
  } catch (e) {
    if (!quiet) $("detail").innerHTML = `<div class="empty"><strong>The box score did not load</strong>${esc(e.message)}. Click the game again to retry.</div>`;
  }
}

function renderBox(data) {
  const ev = events.find(e => e.id === selId) || {};
  const comp = data.header?.competitions?.[0] || ev.competitions?.[0] || {};
  const { away, home } = sides(comp);
  const s = status(ev, comp);
  const pre = s.state === "pre";
  const a = +away.score || 0, h = +home.score || 0;
  const venue = data.gameInfo?.venue?.fullName || "";
  const tv = (ev.competitions?.[0]?.broadcasts || []).flatMap(b => b.names || []).join(", ");
  const nm = (t) => esc(t.team?.shortDisplayName || t.team?.name || t.team?.abbreviation);

  // Header line
  const subParts = pre ? [`Tip-off ${s.text}`, venue, tv] : [s.text, venue];
  const sub = subParts.filter(Boolean).join(", ");
  let title;
  if (pre) title = `${nm(away)} at ${nm(home)}`;
  else {
    const cls = (me, them) => me > them ? "win" : me < them && s.state === "post" ? "lose" : "";
    title = `${nm(away)} <span class="${cls(a, h)}">${esc(away.score)}</span>, ${nm(home)} <span class="${cls(h, a)}">${esc(home.score)}</span>`;
  }

  // Quarters
  const qa = (away.linescores || []).map(q => q.displayValue ?? q.value);
  const qh = (home.linescores || []).map(q => q.displayValue ?? q.value);
  const nq = Math.max(qa.length, qh.length);
  let qt = "";
  if (nq) {
    const heads = Array.from({ length: nq }, (_, i) => i < 4 ? String(i + 1) : (nq > 5 ? `OT${i - 3}` : "OT"));
    const cols = `60px repeat(${nq + 1}, minmax(28px, 1fr))`;
    const row = (t, mine, theirs) => `<span class="row tm"><span class="chip" style="background:${tcolor(t.team)}"></span>${esc(t.team?.abbreviation)}</span>` +
      Array.from({ length: nq }, (_, i) => { const v = mine[i] ?? ""; const w = v !== "" && +v > +(theirs[i] ?? -1); return `<span class="row ${w ? "qw" : ""}">${esc(v)}</span>`; }).join("") +
      `<span class="row tot">${esc(t.score)}</span>`;
    qt = `<div class="qt"><div class="qgrid" style="grid-template-columns:${cols}"><span class="hd"></span>${heads.map(x => `<span class="hd">${x}</span>`).join("")}<span class="hd">T</span>
      ${row(away, qa, qh)}${row(home, qh, qa)}</div></div>`;
  }

  let html = `<div class="ghead"><div><div class="sub ${s.state === "in" ? "live" : ""}">${esc(sub)}</div><h2>${title}</h2></div>${qt}</div>`;

  // Box scores
  const teams = data.boxscore?.players || [];
  const lmap = {};
  (data.leaders || []).forEach(t => { lmap[t.team?.id] = t.leaders || []; });
  const ordered = [...teams].sort((x, y) => (x.team?.id === home.team?.id) - (y.team?.id === home.team?.id));
  if (teams.length) html += ordered.map(t => teamTable(t, lmap[t.team?.id] || [])).join("");
  else if (pre) html += `<div class="empty"><strong>Not started yet</strong>Player stats show here after tip-off.</div>`;

  // Team stats
  html += teamStats(data, away, home, pre);

  $("detail").innerHTML = html;
}

function teamTable(t, leaders) {
  const g = t.statistics?.[0];
  if (!g) return "";
  const labels = g.labels || g.names || [];
  const idx = (l) => labels.indexOf(l);
  const heatCols = ["PTS", "REB", "AST", "STL", "BLK"].map(idx).filter(i => i >= 0);
  const pm = idx("+/-"), pts = idx("PTS");
  const ath = g.athletes || [];
  const played = ath.filter(a => !a.didNotPlay && (a.stats || []).length);
  const max = {};
  heatCols.forEach(c => { max[c] = Math.max(0, ...played.map(a => num(a.stats[c]) || 0)) || 1; });
  const starters = ath.filter(a => a.starter), bench = ath.filter(a => !a.starter);
  const heatMax = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--heat-max")) || .4;

  const row = (a, lastStarter) => {
    const name = a.athlete?.shortName || a.athlete?.displayName || "";
    const pos = a.athlete?.position?.abbreviation || "";
    const first = `<td class="pl ${a.starter ? "st" : ""}">${esc(name)}<span class="pos">${esc(pos)}</span></td>`;
    const trc = lastStarter ? ` class="last-st"` : "";
    if (a.didNotPlay || !(a.stats || []).length) {
      const why = a.reason ? a.reason.toLowerCase().replace(/^\w/, c => c.toUpperCase()) : "Did not play";
      return `<tr${trc}>${first}<td class="dnp" colspan="${labels.length}">${esc(why)}</td></tr>`;
    }
    return `<tr${trc}>${first}${a.stats.map((v, c) => {
      const cls = [];
      let style = "";
      if (heatCols.includes(c)) { const r = (num(v) || 0) / max[c]; if (r > 0) style = ` style="background:rgba(var(--heat),${(r * heatMax).toFixed(2)})"`; if (r >= 1) cls.push("top"); }
      if (c === pts) cls.push("pts");
      if (c === pm) { const n = num(v); if (n > 0) cls.push("plus"); else if (n < 0) cls.push("minus"); }
      else if (v === "0" || v === "0-0") cls.push("zero");
      return `<td class="${cls.join(" ")}"${style}>${esc(v)}</td>`;
    }).join("")}</tr>`;
  };
  let body = starters.map((a, i) => row(a, i === starters.length - 1 && bench.length)).join("") + bench.map(a => row(a, false)).join("");
  if ((g.totals || []).some(v => v !== "")) body += `<tr class="tot"><td>Team</td>${g.totals.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`;

  const short = { points: "pts", rebounds: "reb", assists: "ast" };
  const lead = ["points", "rebounds", "assists"].map(n => leaders.find(c => c.name === n)).filter(Boolean)
    .map(c => { const l = c.leaders?.[0]; return l ? `${esc(l.athlete?.shortName || l.athlete?.displayName)} ${esc(l.displayValue)} ${short[c.name]}` : ""; })
    .filter(Boolean).join(", ");

  return `<section class="team"><div class="team-h"><img src="${esc(logo(t.team))}" alt="" width="22" height="22"><h3>${esc(t.team?.displayName || t.team?.abbreviation)}</h3><span class="lead">${lead}</span></div>
    <div class="scroll"><table><thead><tr><th>Player</th>${labels.map(l => `<th>${esc(l)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div></section>`;
}

function teamStats(data, away, home, pre) {
  const ts = data.boxscore?.teams || [];
  if (ts.length !== 2 || pre) return "";
  const A = ts.find(t => t.homeAway === "away") || ts[0];
  const H = ts.find(t => t.homeAway === "home") || ts[1];
  const pick = [
    ["fieldGoalsMade-fieldGoalsAttempted", "Field goals"], ["fieldGoalPct", "Field goal %"],
    ["threePointFieldGoalsMade-threePointFieldGoalsAttempted", "3-pointers"], ["threePointFieldGoalPct", "3-point %"],
    ["freeThrowsMade-freeThrowsAttempted", "Free throws"], ["totalRebounds", "Rebounds"], ["offensiveRebounds", "Offensive rebounds"],
    ["assists", "Assists"], ["steals", "Steals"], ["blocks", "Blocks"], ["totalTurnovers", "Turnovers", true],
    ["pointsInPaint", "Points in the paint"], ["fastBreakPoints", "Fast break points"], ["largestLead", "Largest lead"], ["fouls", "Fouls", true]
  ];
  const find = (T, n) => (T.statistics || []).find(x => x.name === n);
  const ca = tcolor(A.team), ch = tcolor(H.team);
  const rows = pick.map(([n, label, low]) => {
    const sa = find(A, n), sh = find(H, n);
    if (!sa || !sh) return "";
    const pct = /Pct$/.test(n);
    const da = sa.displayValue + (pct ? "%" : ""), dh = sh.displayValue + (pct ? "%" : "");
    const va = num(sa.displayValue), vh = num(sh.displayValue);
    if (!isFinite(va) || !isFinite(vh)) return "";
    const aWin = va !== vh && (low ? va < vh : va > vh), hWin = va !== vh && !aWin;
    const d = Math.round(Math.abs(va - vh) * 10) / 10;
    const unit = pct ? "%" : /-/.test(sa.displayValue) ? " made" : "";
    const edge = aWin || hWin
      ? `<span class="edge"><span class="chip" style="background:${aWin ? ca : ch}"></span>${esc((aWin ? A : H).team?.abbreviation)} ${low ? "−" : "+"}${d}${unit}</span>`
      : `<span class="edge">Even</span>`;
    return `<tr><td style="text-align:left">${esc(label)}</td><td class="${aWin ? "b" : ""}">${esc(da)}</td><td class="${hWin ? "b" : ""}">${esc(dh)}</td><td>${edge}</td></tr>`;
  }).join("");
  if (!rows) return "";
  return `<section class="tstats"><h3>Team stats</h3><table><thead><tr><th></th><th>${esc(A.team?.abbreviation)}</th><th>${esc(H.team?.abbreviation)}</th><th>Edge</th></tr></thead><tbody>${rows}</tbody></table></section>`;
}

// ---------- Controls ----------
$("prev").onclick = () => goDate(shift(shownDate || ymd(new Date()), -1));
$("next").onclick = () => goDate(shift(shownDate || ymd(new Date()), 1));
$("today").onclick = () => goDate(todayKey);
$("date").onchange = (e) => { if (e.target.value) goDate(e.target.value.replaceAll("-", "")); };
$("refresh").onclick = () => loadScores();
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadScores(); });

applyTheme(theme(), false);
loadScores();
